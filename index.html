<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Takamatsu Shirako</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="app">
            <div class="card nitro" aria-label="Discord-style profile card">
                <div class="card-body">
                    <div class="header-image">
                        <img src="mu0/designant.png" alt="Header image">
                    </div>
                    <div class="inner">
                    <div class="profile-row">
                        <div class="avatar">
                            <img src="https://avatars.githubusercontent.com/u/137693283" alt="Avatar">
                        </div>
                        <div class="profile-info">
                            <div class="name-line">
                                <span class="status" aria-hidden="true"></span>
                                <h2 class="username">Takamatsu Shirako <span class="tag">5hirakowo</span></h2>
                                <span class="badge nitro-badge" title="Nitro" role="button" tabindex="0" data-nitro-start="2024-06-01T12:00:00Z">✦
                                    <span class="tooltip" aria-hidden="true"></span>
                                </span>
                            </div>
                            <div class="role">Game Developer</div>
                        </div>
                        <div class="actions">
                            <button class="btn primary">Message</button>
                            <button class="btn">Add Friend</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
